    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],

            brand: {
              50: '#eff6ff',

              500: '#3b82f6',
              600: '#2563eb',

            }
          }
        }

    }
  </script>

    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    @keyframes pulse-success {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .animate-success { animation: pulse-success 0.3s ease-in-out; }

    @keyframes shake-error {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-error { animation: shake-error 0.4s ease-in-out; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

          <span id="streak-counter">0</span>
        </div>
        <div class="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full font-semibold border border-emerald-200/70" title="Gelernte Verben">
          <i class="fa-solid fa-check text-emerald-500"></i>
          <span id="mastered-counter">0/73</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Hauptbereich -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 flex flex-col gap-5">

    <!-- Modus- & Filterleiste -->
    <div class="bg-white p-3 md:p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row justify-between items-center gap-3">
      
      <!-- Modi -->
      <div class="grid grid-cols-4 bg-slate-100 p-1 rounded-xl w-full md:w-auto text-xs sm:text-sm font-semibold">
        <button onclick="setMode('type')" id="btn-mode-type" class="mode-btn px-2.5 py-2 rounded-lg transition-all flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-keyboard"></i>
          <span>Tippen</span>
        </button>
        <button onclick="setMode('flashcard')" id="btn-mode-flashcard" class="mode-btn px-2.5 py-2 rounded-lg transition-all flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-clone"></i>
          <span>Karten</span>
        </button>
        <button onclick="setMode('mc')" id="btn-mode-mc" class="mode-btn px-2.5 py-2 rounded-lg transition-all flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-list-check"></i>
          <span>Quiz</span>
        </button>
        <button onclick="setMode('list')" id="btn-mode-list" class="mode-btn px-2.5 py-2 rounded-lg transition-all flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-table-list"></i>
          <span>Liste</span>
        </button>
      </div>

      <!-- Filter -->
      <div id="filter-controls" class="flex items-center justify-between w-full md:w-auto gap-2">
        <div class="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-semibold w-full md:w-auto justify-around">
          <button onclick="setFilter('all')" id="btn-filter-all" class="filter-btn px-3 py-1.5 rounded-lg transition-all">Alle (73)</button>
          <button onclick="setFilter('review')" id="btn-filter-review" class="filter-btn px-3 py-1.5 rounded-lg transition-all">Noch üben</button>
          <button onclick="setFilter('mastered')" id="btn-filter-mastered" class="filter-btn px-3 py-1.5 rounded-lg transition-all">Gelernt</button>
        </div>
      </div>

    </div>

    <!-- Fortschrittsbalken -->
    <div id="progress-wrapper" class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
      <div id="progress-bar" class="bg-brand-600 h-2.5 rounded-full transition-all duration-300 w-0"></div>
    </div>

    <!-- Dynamische Trainer-Karte -->
    <div id="trainer-card" class="bg-white rounded-3xl border border-slate-200/90 shadow-xl p-6 sm:p-10 flex flex-col justify-between min-h-[410px] relative overflow-hidden transition-all">
      <!-- Inhalte werden per JS gerendert -->
    </div>

  </main>

      { id: 63, ger: "stechen, stecken", inf: "stick", infAlts: ["stick"], past: "stuck", pastAlts: ["stuck"] },
      { id: 64, ger: "schwimmen", inf: "swim", infAlts: ["swim"], past: "swam", pastAlts: ["swam"] },
      { id: 65, ger: "nehmen, mitnehmen; (weg-, hin)bringen; dauern, (Zeit) brauchen", inf: "take", infAlts: ["take"], past: "took", pastAlts: ["took"] },
      { id: 66, ger: "erzählen, berichten", inf: "tell", infAlts: ["tell"], past: "told", pastAlts: ["told"] },
      { id: 67, ger: "denken, glauben", inf: "think", infAlts: ["think"], past: "thought", pastAlts: ["thought"] },
      { id: 68, ger: "werfen", inf: "throw", infAlts: ["throw"], past: "threw", pastAlts: ["threw"] },
      { id: 69, ger: "verstehen", inf: "understand", infAlts: ["understand"], past: "understood", pastAlts: ["understood"] },
      { id: 70, ger: "aufwachen; (auf)wecken", inf: "wake up", infAlts: ["wake up"], past: "woke up", pastAlts: ["woke up"] },
      { id: 71, ger: "tragen (Kleidung)", inf: "wear", infAlts: ["wear"], past: "wore", pastAlts: ["wore"] },
      { id: 72, ger: "gewinnen", inf: "win", infAlts: ["win"], past: "won", pastAlts: ["won"] },
      { id: 73, ger: "schreiben", inf: "write", infAlts: ["write"], past: "wrote", pastAlts: ["wrote"] }
    ];

    // App-Zustand
    let currentMode = 'type'; // 'type', 'flashcard', 'mc', 'list'
    let currentFilter = 'all'; // 'all', 'review', 'mastered'
    let activeQueue = [];
    let currentIndex = 0;
    let streak = 0;
    let isFlipped = false;

    // Fortschritt aus localStorage laden
    let progressData = {};
    try {
      progressData = JSON.parse(localStorage.getItem('verbMaster_cs_progress')) || {};
    } catch (e) {
      progressData = {};
    }

    // DOM-Elemente
    const trainerCard = document.getElementById('trainer-card');
    const streakCounter = document.getElementById('streak-counter');
    const masteredCounter = document.getElementById('mastered-counter');
    const progressBar = document.getElementById('progress-bar');
    const progressWrapper = document.getElementById('progress-wrapper');
    const filterControls = document.getElementById('filter-controls');

    // Initialisierung
    window.addEventListener('DOMContentLoaded', () => {
      updateModeButtons();
      updateFilterButtons();
      initSession();
      updateHeaderStats();
    });

    function initSession() {
      if (currentFilter === 'mastered') {
        activeQueue = VERBS_DATA.filter(v => progressData[v.id] && progressData[v.id].mastered);
      } else if (currentFilter === 'review') {
        activeQueue = VERBS_DATA.filter(v => !progressData[v.id] || !progressData[v.id].mastered);
      } else {
        activeQueue = [...VERBS_DATA];
      }

      shuffleArray(activeQueue);
      currentIndex = 0;
      updateUI();
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function updateModeButtons() {
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-brand-600', 'shadow-sm');
        btn.classList.add('text-slate-600', 'hover:text-slate-900');
      });
      const activeBtn = document.getElementById(`btn-mode-${currentMode}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'text-brand-600', 'shadow-sm');
        activeBtn.classList.remove('text-slate-600', 'hover:text-slate-900');
      }
    }

    function updateFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-slate-800', 'shadow-sm');
        btn.classList.add('text-slate-500', 'hover:text-slate-800');
      });
      const activeBtn = document.getElementById(`btn-filter-${currentFilter}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'text-slate-800', 'shadow-sm');
        activeBtn.classList.remove('text-slate-500', 'hover:text-slate-800');
      }
    }

    function setMode(mode) {
      currentMode = mode;
      updateModeButtons();

      if (mode === 'list') {
        progressWrapper.classList.add('hidden');
        filterControls.classList.add('hidden');
        renderListMode();
      } else {
        progressWrapper.classList.remove('hidden');
        filterControls.classList.remove('hidden');
        initSession();
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      updateFilterButtons();
      initSession();
    }

    function updateHeaderStats() {
      const total = VERBS_DATA.length;
      const masteredCount = VERBS_DATA.filter(v => progressData[v.id] && progressData[v.id].mastered).length;
      masteredCounter.innerText = `${masteredCount}/${total}`;
      streakCounter.innerText = streak;
    }

    function updateProgressBar() {
      if (activeQueue.length === 0) {
        progressBar.style.width = '100%';
        return;
      }
      const pct = Math.round((currentIndex / activeQueue.length) * 100);
      progressBar.style.width = `${pct}%`;
    }

    function renderEmptyState() {
      const filterLabel = currentFilter === 'mastered' ? 'Gelernt' : currentFilter === 'review' ? 'Noch üben' : 'Alle';
      trainerCard.innerHTML = `
        <div class="flex flex-col items-center justify-center text-center py-12 my-auto">
          <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-full flex items-center justify-center text-2xl mb-4">
            <i class="fa-solid fa-trophy"></i>
          </div>
          <h2 class="text-2xl font-bold text-slate-800 mb-2">Durchgang abgeschlossen!</h2>
          <p class="text-slate-500 max-w-md mb-6">Im Filter „${filterLabel}“ sind aktuell keine weiteren Verben offen. Du kannst den Filter wechseln oder neu starten.</p>
          <div class="flex flex-wrap justify-center gap-3">
            <button onclick="setFilter('all')" class="px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/25 transition-all">
              Alle 73 Verben üben
            </button>
            <button onclick="initSession()" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-all">
              Neu mischen
            </button>
          </div>
        </div>
      `;
    }

    function updateUI() {
      if (currentMode === 'list') {
        renderListMode();
        return;
      }

      updateProgressBar();

      if (activeQueue.length === 0 || currentIndex >= activeQueue.length) {
        renderEmptyState();
        return;
      }

      const currentVerb = activeQueue[currentIndex];

      if (currentMode === 'type') {
        renderTypeMode(currentVerb);
      } else if (currentMode === 'flashcard') {
        renderFlashcardMode(currentVerb);
      } else if (currentMode === 'mc') {
        renderMCMode(currentVerb);
      }
    }

    // Sprachausgabe (Text-to-Speech)
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/\//g, ' or ').replace(/sth\./g, 'something');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    /**
     * Strikte Case-Sensitive Prüfung!
     * - Großbuchstaben (z. B. "Went" statt "went" oder "To go" statt "to go") werden als FALSCH gewertet.
     * - Beim Infinitiv ist optionales kleingeschriebenes "to " erlaubt (z. B. "go" oder "to go").
     * - Erkennt, ob die Eingabe inhaltlich richtig wäre, wenn alles kleingeschrieben wäre (für gezieltes Feedback).
     */
    function validateField(userInput, allowedList, allowOptionalTo) {
      // Nur führende und abschließende Leerzeichen entfernen, Groß-/Kleinschreibung NICHT ändern!
      let trimmed = userInput.trim();

      if (!trimmed) {
        return { isCorrect: false, caseError: false };
      }

      // Bei Infinitiv optionales kleingeschriebenes "to " am Anfang entfernen
      // Hinweis: "To " (großes T) wird NICHT entfernt und führt damit gewollt zum Case-Fehler!
      let processed = trimmed;
      if (allowOptionalTo && processed.startsWith('to ')) {
        processed = processed.slice(3).trim();
      }

      // Mehrfache innere Leerzeichen normalisieren (z. B. "was  /  were" -> "was / were"), Case bleibt erhalten!
      processed = processed.replace(/\s+/g, ' ');

      // Exakter Abgleich (case-sensitive)
      if (allowedList.includes(processed)) {
        return { isCorrect: true, caseError: false };
      }

      // Prüfen, ob nur die Groß-/Kleinschreibung falsch war
      let lowerProcessed = trimmed.toLowerCase();
      if (allowOptionalTo && lowerProcessed.startsWith('to ')) {
        lowerProcessed = lowerProcessed.slice(3).trim();
      }
      lowerProcessed = lowerProcessed.replace(/\s+/g, ' ');

      const lowerAllowed = allowedList.map(a => a.toLowerCase());
      if (lowerAllowed.includes(lowerProcessed)) {
        return { isCorrect: false, caseError: true };
      }

      return { isCorrect: false, caseError: false };
    }

    // --- MODUS 1: TIPPEN (CASE-SENSITIVE) ---
    function renderTypeMode(verb) {
      trainerCard.innerHTML = `
        <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
          <span>VERB ${currentIndex + 1} VON ${activeQueue.length}</span>
          <span class="bg-amber-50 text-amber-700 border border-amber-200/80 px-2.5 py-1 rounded-md font-bold flex items-center gap-1">
            <i class="fa-solid fa-font text-[10px]"></i> Kleinschreibung beachten
          </span>
        </div>

        <div class="my-auto py-6 text-center">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Deutsch</p>
          <h2 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">${verb.ger}</h2>
        </div>

        <div class="space-y-4">
          <div id="feedback-area" class="hidden p-4 rounded-2xl text-center text-sm font-medium"></div>

          <form id="type-form" onsubmit="handleTypeSubmit(event)" class="flex flex-col gap-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <div class="flex justify-between items-center mb-1">
                  <label for="type-inf-input" class="text-xs font-bold text-slate-600">Infinitive</label>
                  <span class="text-[11px] text-slate-400">mit oder ohne „to“</span>
                </div>
                <input type="text" id="type-inf-input" placeholder="z. B. go oder to go" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
                  class="w-full px-4 py-3.5 text-base bg-slate-50 border-2 border-slate-200 focus:border-brand-500 focus:bg-white rounded-xl outline-none transition-all font-medium">
              </div>
              <div>
                <div class="flex justify-between items-center mb-1">
                  <label for="type-past-input" class="text-xs font-bold text-slate-600">Simple Past</label>
                  <span class="text-[11px] text-slate-400">Vergangenheitsform</span>
                </div>
                <input type="text" id="type-past-input" placeholder="z. B. went" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
                  class="w-full px-4 py-3.5 text-base bg-slate-50 border-2 border-slate-200 focus:border-brand-500 focus:bg-white rounded-xl outline-none transition-all font-medium">
              </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl shadow-lg shadow-brand-500/20 transition-all flex items-center justify-center gap-2 mt-2">
              <span>Überprüfen</span>
              <i class="fa-solid fa-check"></i>
            </button>
          </form>
        </div>
      `;

      setTimeout(() => {
        const input = document.getElementById('type-inf-input');
        if (input) input.focus();
      }, 50);
    }

    function handleTypeSubmit(e) {
      e.preventDefault();
      const verb = activeQueue[currentIndex];
      const infInput = document.getElementById('type-inf-input');
      const pastInput = document.getElementById('type-past-input');
      const feedback = document.getElementById('feedback-area');
      const submitBtn = document.getElementById('submit-btn');

      if (!infInput || infInput.disabled) return;

      const infRes = validateField(infInput.value, verb.infAlts, true);
      const pastRes = validateField(pastInput.value, verb.pastAlts, false);
      const allCorrect = infRes.isCorrect && pastRes.isCorrect;
      const anyCaseError = (!infRes.isCorrect && infRes.caseError) || (!pastRes.isCorrect && pastRes.caseError);

      infInput.disabled = true;
      pastInput.disabled = true;

      // Eingabefelder farblich markieren
      infInput.classList.remove('border-slate-200', 'bg-slate-50');
      infInput.classList.add(infRes.isCorrect ? 'border-emerald-500' : 'border-rose-500', infRes.isCorrect ? 'bg-emerald-50/40' : 'bg-rose-50/40');

      pastInput.classList.remove('border-slate-200', 'bg-slate-50');
      pastInput.classList.add(pastRes.isCorrect ? 'border-emerald-500' : 'border-rose-500', pastRes.isCorrect ? 'bg-emerald-50/40' : 'bg-rose-50/40');

      feedback.classList.remove('hidden');

      if (allCorrect) {
        streak++;
        recordProgress(verb.id, true);
        feedback.className = "p-4 rounded-2xl text-center text-sm font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 animate-success flex flex-col sm:flex-row items-center justify-center gap-2";
        feedback.innerHTML = `
          <div>
            <i class="fa-solid fa-circle-check text-emerald-500 text-lg mr-1.5"></i>
            Richtig! <strong class="font-bold">(to) ${verb.inf}</strong> &rarr; <strong class="font-bold">${verb.past}</strong>
          </div>
          <button type="button" onclick="speak('${verb.inf}. ${verb.past}')" class="px-2.5 py-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded-lg text-xs font-bold transition-colors">
            <i class="fa-solid fa-volume-high mr-1"></i> Anhören
          </button>
        `;
        speak(`${verb.inf}. ${verb.past}`);
      } else {
        streak = 0;
        recordProgress(verb.id, false);
        feedback.className = "p-4 rounded-2xl text-center text-sm font-semibold bg-rose-50 text-rose-800 border border-rose-200 animate-error space-y-1";
        
        let caseHintHtml = "";
        if (anyCaseError) {
          caseHintHtml = `
            <div class="inline-block px-3 py-1 bg-amber-100 text-amber-900 rounded-lg text-xs font-bold mb-1">
              <i class="fa-solid fa-triangle-exclamation text-amber-600 mr-1"></i> Groß-/Kleinschreibung beachten! Englische Verben werden kleingeschrieben.
            </div>
          `;
        }

        feedback.innerHTML = `
          ${caseHintHtml}
          <div class="flex flex-col sm:flex-row items-center justify-center gap-2">
            <div>
              <i class="fa-solid fa-circle-xmark text-rose-500 text-lg mr-1.5"></i>
              Leider falsch. Richtig ist: <span class="font-bold underline">(to) ${verb.inf}</span> &rarr; <span class="font-bold underline">${verb.past}</span>
            </div>
            <button type="button" onclick="speak('${verb.inf}. ${verb.past}')" class="px-2.5 py-1 bg-rose-100 hover:bg-rose-200 text-rose-800 rounded-lg text-xs font-bold transition-colors">
              <i class="fa-solid fa-volume-high mr-1"></i> Anhören
            </button>
          </div>
        `;
      }

      updateHeaderStats();

      // Button durch "Nächstes Verb" ersetzen
      submitBtn.outerHTML = `
        <button type="button" id="next-btn" onclick="nextQuestion()" class="w-full py-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 mt-2">
          <span>Nächstes Verb</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      `;

      setTimeout(() => {
        const nextBtn = document.getElementById('next-btn');
        if (nextBtn) nextBtn.focus();
      }, 50);
    }

    // --- MODUS 2: KARTEIKARTEN ---
    function renderFlashcardMode(verb) {
      isFlipped = false;
      trainerCard.innerHTML = `
        <div class="flex justify-between items-center text-xs font-semibold text-slate-400 mb-4">
          <span>KARTE ${currentIndex + 1} VON ${activeQueue.length}</span>
          <span class="bg-brand-50 text-brand-700 px-2.5 py-1 rounded-md font-bold">Karteikarte</span>
        </div>

        <div onclick="toggleFlashcard()" class="perspective-1000 my-auto cursor-pointer select-none">
          <div id="flashcard-inner" class="relative w-full h-64 sm:h-72 rounded-3xl border-2 border-slate-200 bg-gradient-to-b from-white to-slate-50 shadow-md transition-all duration-500 transform-style-3d flex items-center justify-center p-6 text-center">
            
            <!-- Vorderseite: NUR Deutsch -->
            <div class="absolute inset-0 backface-hidden flex flex-col items-center justify-center p-6">
              <span class="text-xs font-bold text-brand-600 uppercase tracking-wider mb-2">Deutsch</span>
              <h2 class="text-3xl sm:text-5xl font-extrabold text-slate-900 mb-2 leading-tight">${verb.ger}</h2>
              <p class="text-xs text-slate-400 mt-6 flex items-center gap-1.5">
                <i class="fa-solid fa-hand-pointer text-brand-500"></i> Karte antippen zum Umdrehen
              </p>
            </div>

            <!-- Rückseite: Infinitive & Simple Past -->
            <div class="absolute inset-0 backface-hidden rotate-y-180 flex flex-col items-center justify-center p-6 bg-brand-50/60 rounded-3xl border-2 border-brand-200">
              <div class="space-y-3">
                <div>
                  <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Infinitive</span>
                  <p class="text-2xl sm:text-3xl font-bold text-slate-800">(to) ${verb.inf}</p>
                </div>
                <div>
                  <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Simple Past</span>
                  <p class="text-3xl sm:text-4xl font-extrabold text-brand-700">${verb.past}</p>
                </div>
              </div>
              <button type="button" onclick="speak('${verb.inf}. ${verb.past}'); event.stopPropagation();" class="mt-4 px-3.5 py-1.5 bg-white text-brand-600 hover:bg-brand-100 border border-brand-200 rounded-full text-xs font-bold shadow-sm transition-all flex items-center gap-1.5" title="Aussprache anhören">
                <i class="fa-solid fa-volume-high"></i> Anhören
              </button>
            </div>

          </div>
        </div>

        <!-- Selbstbewertung -->
        <div class="mt-6 flex items-center justify-between gap-3">
          <button onclick="handleCardFeedback(${verb.id}, false)" class="flex-1 px-5 py-3.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl border border-rose-200 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-rotate-left"></i> Nochmal üben
          </button>
          <button onclick="handleCardFeedback(${verb.id}, true)" class="flex-1 px-5 py-3.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold rounded-xl border border-emerald-200 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-check"></i> Gewusst
          </button>
        </div>
      `;
    }

    function toggleFlashcard() {
      const cardInner = document.getElementById('flashcard-inner');
      if (!cardInner) return;
      isFlipped = !isFlipped;
      if (isFlipped) {
        cardInner.classList.add('rotate-y-180');
      } else {
        cardInner.classList.remove('rotate-y-180');
      }
    }

    function handleCardFeedback(verbId, mastered) {
      recordProgress(verbId, mastered);
      if (mastered) streak++;
      else streak = 0;
      updateHeaderStats();
      nextQuestion();
    }

    // --- MODUS 3: MULTIPLE CHOICE QUIZ ---
    function renderMCMode(verb) {
      const correctText = `to ${verb.inf} → ${verb.past}`;
      const options = [correctText];

      while (options.length < 4) {
        const randomVerb = VERBS_DATA[Math.floor(Math.random() * VERBS_DATA.length)];
        const optText = `to ${randomVerb.inf} → ${randomVerb.past}`;
        if (!options.includes(optText)) {
          options.push(optText);
        }
      }
      shuffleArray(options);

      trainerCard.innerHTML = `
        <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
          <span>FRAGE ${currentIndex + 1} VON ${activeQueue.length}</span>
          <span class="bg-brand-50 text-brand-700 px-2.5 py-1 rounded-md font-bold">Multiple Choice</span>
        </div>

        <div class="my-auto py-4 text-center">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Wähle die richtige englische Form für:</p>
          <h2 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">${verb.ger}</h2>
        </div>

        <div>
          <div id="feedback-area" class="hidden mb-4 p-3.5 rounded-2xl text-center text-sm font-semibold"></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="mc-options">
            ${options.map((opt, idx) => `
              <button type="button" data-val="${opt.replace(/"/g, '&quot;')}" onclick="handleMCClick(this)" 
                class="mc-option p-4 bg-slate-50 hover:bg-slate-100 border-2 border-slate-200 hover:border-slate-300 rounded-2xl font-bold text-slate-800 text-base text-left transition-all flex justify-between items-center">
                <span>${opt}</span>
                <i class="fa-regular fa-circle text-slate-300 text-lg icon-placeholder"></i>
              </button>
            `).join('')}
          </div>
          <div id="mc-next-container" class="hidden mt-4 flex justify-end">
            <button type="button" onclick="nextQuestion()" class="w-full sm:w-auto px-6 py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl transition-all flex items-center justify-center gap-2">
              <span>Nächste Frage</span>
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      `;
    }

    function handleMCClick(selectedBtn) {
      const verb = activeQueue[currentIndex];
      const correctVal = `to ${verb.inf} → ${verb.past}`;
      const selectedVal = selectedBtn.getAttribute('data-val');
      const allOptions = document.querySelectorAll('.mc-option');
      const feedback = document.getElementById('feedback-area');
      const nextContainer = document.getElementById('mc-next-container');

      allOptions.forEach(btn => {
        btn.disabled = true;
        btn.classList.remove('hover:bg-slate-100', 'hover:border-slate-300');
      });

      feedback.classList.remove('hidden');

      if (selectedVal === correctVal) {
        streak++;
        recordProgress(verb.id, true);
        selectedBtn.classList.remove('bg-slate-50', 'border-slate-200');
        selectedBtn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-800');
        selectedBtn.querySelector('.icon-placeholder').className = "fa-solid fa-circle-check text-emerald-500 text-lg";

        feedback.className = "mb-4 p-3.5 rounded-2xl text-center text-sm font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 animate-success";
        feedback.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500 mr-1.5"></i> Perfekt! Das ist richtig.`;
        speak(`${verb.inf}. ${verb.past}`);
      } else {
        streak = 0;
        recordProgress(verb.id, false);
        selectedBtn.classList.remove('bg-slate-50', 'border-slate-200');
        selectedBtn.classList.add('bg-rose-50', 'border-rose-400', 'text-rose-800');
        selectedBtn.querySelector('.icon-placeholder').className = "fa-solid fa-circle-xmark text-rose-500 text-lg";

        allOptions.forEach(btn => {
          if (btn.getAttribute('data-val') === correctVal) {
            btn.classList.remove('bg-slate-50', 'border-slate-200');
            btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-800');
            btn.querySelector('.icon-placeholder').className = "fa-solid fa-circle-check text-emerald-500 text-lg";
          }
        });

        feedback.className = "mb-4 p-3.5 rounded-2xl text-center text-sm font-semibold bg-rose-50 text-rose-800 border border-rose-200 animate-error";
        feedback.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-500 mr-1.5"></i> Nicht ganz! Richtig ist: <strong>${correctVal}</strong>`;
      }

      updateHeaderStats();
      nextContainer.classList.remove('hidden');
    }

    // --- MODUS 4: VERBLISTE (SUCHBAR) ---
    function renderListMode() {
      trainerCard.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900">Alle 73 Verben im Überblick</h2>
            <p class="text-xs text-slate-500">Alle Formen werden im Englischen kleingeschrieben.</p>
          </div>
          <div class="flex items-center gap-2">
            <div class="relative flex-1 sm:w-64">
              <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="text" id="verb-search" oninput="filterVerbTable()" placeholder="Verb suchen..." 
                class="w-full pl-9 pr-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:bg-white transition-all">
            </div>
            <button onclick="resetAllProgress()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-bold transition-colors" title="Fortschritt zurücksetzen">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>

        <div class="overflow-x-auto max-h-[520px] overflow-y-auto mt-3 -mx-2 px-2">
          <table class="w-full text-left text-sm border-collapse">
            <thead class="sticky top-0 bg-white z-10 shadow-sm">
              <tr class="border-b border-slate-200 text-slate-400 font-bold text-xs uppercase tracking-wider">
                <th class="py-3 px-2">Deutsch</th>
                <th class="py-3 px-2">Infinitive</th>
                <th class="py-3 px-2">Simple Past</th>
                <th class="py-3 px-2 text-right">Status</th>
              </tr>
            </thead>
            <tbody id="verb-table-body" class="divide-y divide-slate-100">
            </tbody>
          </table>
        </div>
      `;
      filterVerbTable();
    }

    function filterVerbTable() {
      const searchInput = document.getElementById('verb-search');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const tbody = document.getElementById('verb-table-body');
      if (!tbody) return;

      const filtered = VERBS_DATA.filter(v =>
        v.ger.toLowerCase().includes(query) ||
        v.inf.toLowerCase().includes(query) ||
        v.past.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-slate-400">Keine passenden Verben gefunden.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(v => {
        const isMastered = progressData[v.id] && progressData[v.id].mastered;
        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="py-3 px-2 text-slate-700 font-medium">${v.ger}</td>
            <td class="py-3 px-2 font-bold text-slate-900 whitespace-nowrap">
              (to) ${v.inf}
              <button onclick="speak('${v.inf}')" class="ml-1 text-slate-400 hover:text-brand-600 transition-colors" title="Anhören">
                <i class="fa-solid fa-volume-high text-xs"></i>
              </button>
            </td>
            <td class="py-3 px-2 font-bold text-brand-600 whitespace-nowrap">
              ${v.past}
              <button onclick="speak('${v.past}')" class="ml-1 text-slate-400 hover:text-brand-600 transition-colors" title="Anhören">
                <i class="fa-solid fa-volume-high text-xs"></i>
              </button>
            </td>
            <td class="py-3 px-2 text-right whitespace-nowrap">
              <button onclick="toggleMasteredManual(${v.id})" class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full font-semibold transition-all ${
                isMastered
                  ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100'
                  : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
              }">
                ${isMastered ? '<i class="fa-solid fa-check text-[10px]"></i> Gelernt' : 'Offen'}
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function toggleMasteredManual(verbId) {
      if (!progressData[verbId]) {
        progressData[verbId] = { attempts: 1, successes: 2, mastered: true };
      } else {
        progressData[verbId].mastered = !progressData[verbId].mastered;
        progressData[verbId].successes = progressData[verbId].mastered ? 2 : 0;
      }
      localStorage.setItem('verbMaster_cs_progress', JSON.stringify(progressData));
      updateHeaderStats();
      filterVerbTable();
    }

    function resetAllProgress() {
      progressData = {};
      streak = 0;
      localStorage.removeItem('verbMaster_cs_progress');
      updateHeaderStats();
      filterVerbTable();
    }

    function nextQuestion() {
      currentIndex++;
      updateUI();
    }

    // Lernfortschritt speichern
    function recordProgress(verbId, isSuccess) {
      if (!progressData[verbId]) {
        progressData[verbId] = { attempts: 0, successes: 0, mastered: false };
      }

      progressData[verbId].attempts++;
      if (isSuccess) {
        progressData[verbId].successes++;
      } else {
        progressData[verbId].successes = Math.max(0, progressData[verbId].successes - 1);
      }

      if (progressData[verbId].successes >= 2) {
        progressData[verbId].mastered = true;
      } else if (!isSuccess) {
        progressData[verbId].mastered = false;
      }

      localStorage.setItem('verbMaster_cs_progress', JSON.stringify(progressData));
    }
  </script>
</body>
</html>
